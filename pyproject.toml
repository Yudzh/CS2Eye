[project]
name = "cs2eye"
version = "0.1.0"
description = ""
authors = [
    {name = "Yudzh",email = "37805718+Yudzh@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard] (>=0.47.0,<0.48.0)",
    "pydantic-settings>=2.4.0",
    "python-multipart (>=0.0.29,<0.0.30)",
    "httpx (>=0.28.1,<0.29.0)",
    "rarfile (>=4.2,<5.0)",
    "py7zr (>=1.1.0,<2.0.0)",
    "demoparser2 (>=0.41.3,<0.42.0)"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]
