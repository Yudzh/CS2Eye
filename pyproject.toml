[project]
name = "cs2eye"
version = "0.1.0"
description = "CS2Eye clean application foundation"
authors = [
    {name = "Yudzh", email = "37805718+Yudzh@users.noreply.github.com"},
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4,<2.0.0",
    "asyncpg>=0.31.0,<0.32.0",
    "fastapi>=0.115.0",
    "httpx[socks]>=0.28.1,<0.29.0",
    "pydantic-settings>=2.4.0",
    "python-multipart==0.0.20",
    "rarfile>=4.2,<5.0",
    "sqlalchemy[asyncio]>=2.0.49,<3.0.0",
    "uvicorn[standard]>=0.47.0,<0.48.0",
    "beautifulsoup4>=4.13.4,<5.0.0",
    "demoparser2==0.41.4",
    "numpy>=2.0,<3.0",
    "ollama>=0.6.1,<0.7.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1,<0.23.0",
    "pytest>=9.0.3,<10.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
