services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cs2eye}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - cs2eye_clean_pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-cs2eye}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    restart: "no"
    environment: &api-environment
      APP_NAME: ${APP_NAME:-CS2Eye API}
      APP_ENV: ${APP_ENV:-local}
      DEBUG: ${DEBUG:-true}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-admin}@db:5432/${POSTGRES_DB:-cs2eye}
      DEMO_STORAGE_ROOT: ${DEMO_STORAGE_ROOT:-/app/storage}
      DEMO_MAX_FILE_SIZE_BYTES: ${DEMO_MAX_FILE_SIZE_BYTES:-2147483648}
      DEMO_ARCHIVE_MAX_DEPTH: ${DEMO_ARCHIVE_MAX_DEPTH:-5}
      MAX_RANKING_SNAPSHOT_AGE_DAYS: ${MAX_RANKING_SNAPSHOT_AGE_DAYS:-14}
      BO3_API_BASE_URL: ${BO3_API_BASE_URL:-https://api.bo3.gg/api/v2}
      BO3_SITE_BASE_URL: ${BO3_SITE_BASE_URL:-https://bo3.gg}
      BO3_REQUEST_TIMEOUT_SECONDS: ${BO3_REQUEST_TIMEOUT_SECONDS:-20}
      BO3_USER_AGENT: ${BO3_USER_AGENT:-CS2Eye/0.1 (+local analytics project)}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      ALL_PROXY: ${ALL_PROXY:-}
      NO_PROXY: ${NO_PROXY:-db,api,webui,localhost,127.0.0.1}
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    volumes:
      - ./src:/app/src
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini:ro

  api:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    restart: unless-stopped
    # Browsec Desktop applies its TUN policy to host-originated traffic, but
    # not reliably to connections forwarded from a Docker bridge. Running the
    # API in the host network namespace makes BO3.gg requests follow exactly
    # the same VPN route as curl/the browser on the host.
    network_mode: host
    environment:
      <<: *api-environment
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-admin}@127.0.0.1:${POSTGRES_PORT:-5433}/${POSTGRES_DB:-cs2eye}
    volumes:
      - ./src:/app/src
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini:ro
      - ${DEMO_STORAGE_HOST_PATH:-/media/eugene/HDD8/demos}:/app/storage
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command:
      [
        "uvicorn",
        "cs2eye.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  webui:
    build:
      context: ./webui
      dockerfile: Dockerfile.local
      network: host
    restart: unless-stopped
    network_mode: host
    environment:
      VITE_API_PROXY_TARGET: http://127.0.0.1:${API_PORT:-8000}
    volumes:
      - ./webui:/app
      - cs2eye_webui_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@cs2eye.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - cs2eye_pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy

volumes:
  cs2eye_clean_pg_data:
  cs2eye_pgadmin_data:
  cs2eye_webui_node_modules:
